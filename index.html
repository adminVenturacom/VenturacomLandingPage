<!DOCTYPE html>
<html lang="es" class="scroll-smooth antialiased">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apven — Cables Originales Apple</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
          },
          colors: {
            apven: {
              canvas: '#F5F5F7',
              surface: '#FFFFFF',
              dark: '#161617',
              gray: '#86868B',
              blue: '#0071E3',
              blueHover: '#0077ED',
              green: '#34C759'
            }
          },
          boxShadow: {
            'apple': '0 4px 20px rgba(0, 0, 0, 0.04)',
            'apple-hover': '0 20px 40px rgba(0, 0, 0, 0.08)',
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #F5F5F7;
      color: #161617;
      font-family: 'Inter', -apple-system, sans-serif;
    }
    .frosted-nav {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-black selection:text-white">

  <header class="sticky top-0 z-40 w-full frosted-nav border-b border-black/[0.06]">
    <div class="max-w-6xl mx-auto px-5 h-16 flex items-center justify-between">
      
      <!-- Minimalist Apven Brand Logo -->
      <a href="#" class="flex items-center space-x-2.5 group">
        <div class="w-9 h-9 rounded-2xl bg-black flex items-center justify-center p-2 shadow-sm transition-transform group-hover:scale-105">
          <svg viewBox="0 0 100 100" class="w-full h-full fill-none" xmlns="http://www.w3.org/2000/svg">
            <path d="M50 14 C55 8, 65 10, 63 19 C56 22, 49 18, 50 14Z" fill="#FFFFFF"/>
            <path d="M24 32 L46 76 C48 80, 52 80, 54 76 L76 32 C78 29, 75 27, 72 27 C68 27, 66 30, 64 34 L50 64 L36 34 C34 30, 32 27, 28 27 C25 27, 22 29, 24 32Z" fill="#FFFFFF"/>
            <rect x="48" y="44" width="4" height="10" rx="2" fill="#E5A93C"/>
          </svg>
        </div>
        <span class="text-lg font-bold tracking-tight text-apven-dark">Apven</span>
      </a>

      <!-- Visual Filter Pills -->
      <div class="flex items-center space-x-1.5 bg-neutral-200/60 p-1 rounded-full text-xs font-semibold">
        <button onclick="setFilter('all', this)" class="filter-pill px-3.5 py-1.5 rounded-full bg-white text-black shadow-sm transition-all">Todos</button>
        <button onclick="setFilter('mac', this)" class="filter-pill px-3.5 py-1.5 rounded-full text-apven-gray hover:text-black transition-all">Mac</button>
        <button onclick="setFilter('iphone', this)" class="filter-pill px-3.5 py-1.5 rounded-full text-apven-gray hover:text-black transition-all">iPhone</button>
        <button onclick="setFilter('watch', this)" class="filter-pill px-3.5 py-1.5 rounded-full text-apven-gray hover:text-black transition-all">Watch</button>
      </div>

      <!-- Quick Bag Icon -->
      <button onclick="toggleCartDrawer(true)" class="relative p-2 rounded-full hover:bg-neutral-100 transition-colors">
        <svg class="w-5 h-5 text-apven-dark" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/>
        </svg>
        <span id="bagCounter" class="absolute top-1 right-1 w-4 h-4 bg-black text-white text-[10px] font-bold rounded-full flex items-center justify-center">0</span>
      </button>

    </div>
  </header>

  <main class="flex-grow max-w-6xl mx-auto px-5 w-full py-8">
    <div id="productGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Injected via JavaScript -->
    </div>
  </main>

  <div id="checkoutModal" class="fixed inset-0 z-50 bg-black/40 backdrop-blur-md flex items-end sm:items-center justify-center p-0 sm:p-4 opacity-0 pointer-events-none transition-opacity duration-200">
    <div id="checkoutCard" class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl p-6 shadow-apple-hover transform translate-y-8 sm:translate-y-0 sm:scale-95 transition-transform duration-200">
      
      <div class="flex items-center justify-between mb-4">
        <div class="flex items-center space-x-2">
          <div class="w-2 h-2 rounded-full bg-apven-green"></div>
          <span class="text-[11px] font-bold uppercase tracking-wider text-apven-gray">Compra Directa</span>
        </div>
        <button onclick="closeCheckout()" class="p-1 rounded-full text-apven-gray hover:text-black">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>

      <!-- Preview summary -->
      <div id="checkoutItemDetails" class="flex items-center justify-between p-4 bg-apven-canvas rounded-2xl mb-5">
        <!-- Injected dynamically -->
      </div>

      <!-- 1-Touch Apple Pay simulation -->
      <button onclick="confirmOrder('Apple Pay')" class="w-full py-3.5 bg-black hover:bg-neutral-800 text-white rounded-2xl text-sm font-semibold flex items-center justify-center space-x-2 transition-all active:scale-[0.98] shadow-sm mb-3">
        <span>Pagar con</span>
        <svg class="h-4 fill-white inline" viewBox="0 0 170 170"><path d="M150.37 130.25c-2.45 5.66-5.35 10.87-8.71 15.66-4.58 6.53-8.33 11.05-11.22 13.56-4.48 4.12-9.28 6.23-14.42 6.35-3.69 0-8.14-1.05-13.32-3.18-5.19-2.12-9.97-3.17-14.34-3.17-4.58 0-9.49 1.05-14.75 3.17-5.26 2.13-9.5 3.24-12.74 3.35-4.35.13-9.16-1.9-14.42-6.08-3.7-3.04-7.69-7.85-11.97-14.42-6.3-9.74-11.16-20.94-14.59-33.6-3.43-12.67-5.15-24.23-5.15-34.69 0-14.9 3.86-27.18 11.58-36.85 7.72-9.67 17.51-14.65 29.37-14.94 4.8 0 10.13 1.25 15.98 3.75 5.86 2.5 9.74 3.75 11.66 3.75 1.62 0 5.73-1.35 12.33-4.04 6.6-2.7 12.18-3.89 16.74-3.58 13.06.66 23.36 5.68 30.9 15.06-11.45 6.94-17.06 16.54-16.84 28.8.21 9.8 4.09 17.96 11.64 24.47 5.08 4.41 10.74 7.23 16.99 8.46-2.58 7.62-5.75 15.19-9.51 22.71zM119.22 33.15c0-7.39 2.65-14.28 7.95-20.67 5.3-6.4 11.83-10.45 19.59-12.15.54 1.77.81 3.5.81 5.19 0 7.39-2.78 14.46-8.34 21.2-5.56 6.74-12.22 10.68-19.98 11.81-.03-1.78-.03-3.57-.03-5.38z"/></svg>
        <span class="tracking-wide">Pay</span>
      </button>

      <!-- Standard Fast Confirm -->
      <button onclick="confirmOrder('Tarjeta')" id="checkoutCardBtn" class="w-full py-3.5 bg-apven-blue hover:bg-apven-blueHover text-white rounded-2xl text-xs font-semibold tracking-wide transition-all active:scale-[0.98]">
        Confirmar Envío Express
      </button>
    </div>
  </div>

  <div id="cartBackdrop" onclick="toggleCartDrawer(false)" class="fixed inset-0 z-50 bg-black/30 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-200"></div>
  <aside id="cartDrawer" class="fixed top-0 right-0 z-50 h-full w-full max-w-sm bg-white shadow-apple-hover flex flex-col transform translate-x-full transition-transform duration-300">
    <div class="p-5 border-b border-black/[0.06] flex items-center justify-between">
      <h3 class="text-base font-bold text-apven-dark">Bolsa Apven</h3>
      <button onclick="toggleCartDrawer(false)" class="p-1 rounded-full text-apven-gray hover:text-black">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>

    <div id="cartItemsList" class="flex-grow overflow-y-auto p-5 space-y-3">
      <!-- Injected dynamically -->
    </div>

    <div id="cartFooter" class="p-5 border-t border-black/[0.06] bg-apven-canvas">
      <div class="flex justify-between items-center text-sm font-bold text-apven-dark mb-4">
        <span>Total</span>
        <span id="cartDrawerTotal">$0.00</span>
      </div>
      <button onclick="openBagCheckout()" class="w-full py-3.5 bg-black hover:bg-neutral-800 text-white text-xs font-semibold rounded-2xl transition-all shadow-sm">
        Pagar Ahora &bull; Envío Gratis
      </button>
    </div>
  </aside>

  <div id="toast" class="fixed bottom-6 right-6 z-50 bg-black text-white text-xs font-medium px-4 py-3 rounded-2xl shadow-xl flex items-center space-x-2.5 transform translate-y-24 opacity-0 transition-all duration-300 pointer-events-none">
    <span class="w-2 h-2 rounded-full bg-apven-green"></span>
    <span id="toastMsg">¡Agregado!</span>
  </div>

  <footer class="py-6 text-center text-[11px] text-apven-gray border-t border-black/[0.05] bg-white">
    <div class="max-w-6xl mx-auto px-5 flex items-center justify-between">
      <span class="font-semibold text-apven-dark">Apven &bull; 100% Original Apple</span>
      <span>Garantía Oficial de 1 Año</span>
    </div>
  </footer>

  <script>
    const products = [
      {
        id: 'usbc',
        name: 'USB-C a USB-C',
        category: 'mac',
        specs: ['Trenzado', 'Carga Rápida'],
        graphicType: 'usbc',
        variants: [
          { label: '60W &bull; 1m', badge: '60W', price: 19 },
          { label: '240W &bull; 2m', badge: '240W EPR', price: 29 }
        ]
      },
      {
        id: 'magsafe',
        name: 'USB-C a MagSafe 3',
        category: 'mac',
        specs: ['Magnético', 'LED Indicador', '2 metros'],
        graphicType: 'magsafe',
        isColorSwatches: true,
        variants: [
          { label: 'Medianoche', color: '#1B2028', price: 49 },
          { label: 'Blanco Estelar', color: '#E5DFD5', price: 49 },
          { label: 'Gris Espacial', color: '#68696E', price: 49 },
          { label: 'Plata', color: '#E1E2E5', price: 49 }
        ]
      },
      {
        id: 'tb4',
        name: 'Thunderbolt 4 Pro',
        category: 'mac',
        specs: ['40 Gb/s', 'Negro Trenzado', '100W'],
        graphicType: 'tb4',
        variants: [
          { label: '1 metro', badge: '1m', price: 69 },
          { label: '1.8 metros', badge: '1.8m', price: 129 },
          { label: '3 metros', badge: '3m', price: 159 }
        ]
      },
      {
        id: 'lightning',
        name: 'USB-C a Lightning',
        category: 'iphone',
        specs: ['C94 Oficial', 'iPhone / AirPods'],
        graphicType: 'lightning',
        variants: [
          { label: '1 metro', badge: '1m', price: 19 },
          { label: '2 metros', badge: '2m', price: 29 }
        ]
      },
      {
        id: 'watch',
        name: 'Cargador Rápido Apple Watch',
        category: 'watch',
        specs: ['Inducción Rápida', 'Aluminio', '1m'],
        graphicType: 'watch',
        variants: [
          { label: '1 metro', badge: 'USB-C', price: 29 }
        ]
      },
      {
        id: 'adapter',
        name: 'Adaptador 35W Dual USB-C',
        category: 'mac',
        specs: ['Doble Puerto', 'Carga GaN'],
        graphicType: 'adapter',
        variants: [
          { label: 'Compacto 35W', badge: '35W Dual', price: 59 }
        ]
      }
    ];

    let currentFilter = 'all';
    let selectedVariants = { usbc: 0, magsafe: 0, tb4: 0, lightning: 0, watch: 0, adapter: 0 };
    let cart = [];
    let currentPurchase = null;

    function renderVisual(type, colorHex) {
      if (type === 'usbc') {
        return `
          <svg class="w-full h-36" viewBox="0 0 280 120" fill="none">
            <path d="M40 75 C90 75, 90 35, 140 35 C190 35, 190 75, 240 75" stroke="#E2E2E5" stroke-width="6.5" stroke-linecap="round"/>
            <path d="M40 75 C90 75, 90 35, 140 35 C190 35, 190 75, 240 75" stroke="#9A9AA0" stroke-width="6.5" stroke-dasharray="2 3" stroke-linecap="round"/>
            <rect x="22" y="66" width="22" height="18" rx="4" fill="#FFFFFF" stroke="#D1D1D6" stroke-width="1.5"/>
            <rect x="14" y="69" width="10" height="12" rx="2" fill="#A1A1A6"/>
            <rect x="236" y="66" width="22" height="18" rx="4" fill="#FFFFFF" stroke="#D1D1D6" stroke-width="1.5"/>
            <rect x="256" y="69" width="10" height="12" rx="2" fill="#A1A1A6"/>
          </svg>
        `;
      } else if (type === 'magsafe') {
        const hex = colorHex || '#1B2028';
        return `
          <svg class="w-full h-36" viewBox="0 0 280 120" fill="none">
            <path d="M40 75 C95 75, 95 35, 140 35 C185 35, 185 75, 240 75" stroke="${hex}" stroke-width="7" stroke-linecap="round"/>
            <rect x="18" y="64" width="26" height="22" rx="5" fill="#FFFFFF" stroke="#D1D1D6" stroke-width="1.5"/>
            <circle cx="31" cy="70" r="2.5" fill="#34C759"/>
            <rect x="9" y="68" width="10" height="14" rx="2" fill="#8E8E93"/>
            <rect x="236" y="66" width="22" height="18" rx="4" fill="#FFFFFF" stroke="#D1D1D6" stroke-width="1.5"/>
            <rect x="256" y="69" width="10" height="12" rx="2" fill="#A1A1A6"/>
          </svg>
        `;
      } else if (type === 'tb4') {
        return `
          <svg class="w-full h-36" viewBox="0 0 280 120" fill="none">
            <path d="M40 70 Q 140 10 240 70" stroke="#161617" stroke-width="7.5" stroke-linecap="round"/>
            <path d="M40 70 Q 140 10 240 70" stroke="#48484A" stroke-width="7.5" stroke-dasharray="2 3" stroke-linecap="round"/>
            <rect x="20" y="60" width="24" height="20" rx="4.5" fill="#161617"/>
            <path d="M33 64 L30 70 H34 L31 76" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <rect x="10" y="63" width="11" height="14" rx="2.5" fill="#636366"/>
            <rect x="236" y="60" width="24" height="20" rx="4.5" fill="#161617"/>
            <rect x="259" y="63" width="11" height="14" rx="2.5" fill="#636366"/>
          </svg>
        `;
      } else if (type === 'watch') {
        return `
          <svg class="w-full h-36" viewBox="0 0 280 120" fill="none">
            <path d="M85 60 L235 60" stroke="#E2E2E5" stroke-width="6" stroke-linecap="round"/>
            <circle cx="70" cy="60" r="28" fill="#FFFFFF" stroke="#D1D1D6" stroke-width="2"/>
            <circle cx="70" cy="60" r="22" fill="#F5F5F7"/>
            <rect x="235" y="52" width="22" height="16" rx="4" fill="#FFFFFF" stroke="#D1D1D6" stroke-width="1.5"/>
            <rect x="255" y="55" width="9" height="10" rx="2" fill="#A1A1A6"/>
          </svg>
        `;
      } else if (type === 'adapter') {
        return `
          <svg class="w-full h-36" viewBox="0 0 280 120" fill="none">
            <rect x="100" y="24" width="80" height="72" rx="12" fill="#FFFFFF" stroke="#D1D1D6" stroke-width="2"/>
            <rect x="126" y="44" width="28" height="12" rx="3" fill="#161617"/>
            <rect x="126" y="64" width="28" height="12" rx="3" fill="#161617"/>
          </svg>
        `;
      } else {
        // Lightning
        return `
          <svg class="w-full h-36" viewBox="0 0 280 120" fill="none">
            <path d="M40 70 C95 70, 95 38, 140 38 C185 38, 185 70, 240 70" stroke="#E5E5EA" stroke-width="6.5" stroke-linecap="round"/>
            <rect x="22" y="62" width="22" height="16" rx="3.5" fill="#FFFFFF" stroke="#D1D1D6" stroke-width="1.5"/>
            <rect x="13" y="65" width="10" height="10" rx="2" fill="#E5E5EA"/>
            <line x1="16" y1="67" x2="16" y2="73" stroke="#E5A93C" stroke-width="1.2"/>
            <line x1="18" y1="67" x2="18" y2="73" stroke="#E5A93C" stroke-width="1.2"/>
            <rect x="236" y="62" width="22" height="16" rx="3.5" fill="#FFFFFF" stroke="#D1D1D6" stroke-width="1.5"/>
            <rect x="256" y="65" width="10" height="10" rx="2" fill="#A1A1A6"/>
          </svg>
        `;
      }
    }

    function renderGallery() {
      const grid = document.getElementById('productGrid');
      const filtered = products.filter(p => currentFilter === 'all' || p.category === currentFilter);

      grid.innerHTML = filtered.map(item => {
        const selIdx = selectedVariants[item.id] || 0;
        const currentVar = item.variants[selIdx];

        let variantSelector = '';
        if (item.isColorSwatches) {
          variantSelector = `
            <div class="flex items-center space-x-2 py-1">
              ${item.variants.map((v, idx) => `
                <button onclick="pickVariant('${item.id}', ${idx})" 
                  class="w-6 h-6 rounded-full border transition-all ${selIdx === idx ? 'ring-2 ring-black scale-110' : 'border-black/20 hover:scale-105'}"
                  style="background-color: ${v.color};"
                  title="${v.label}">
                </button>
              `).join('')}
              <span class="text-xs text-apven-gray ml-2 font-medium">${currentVar.label}</span>
            </div>
          `;
        } else if (item.variants.length > 1) {
          variantSelector = `
            <div class="flex flex-wrap gap-1.5 py-1">
              ${item.variants.map((v, idx) => `
                <button onclick="pickVariant('${item.id}', ${idx})" 
                  class="px-3 py-1 rounded-full text-xs font-semibold transition-all ${selIdx === idx ? 'bg-black text-white' : 'bg-neutral-100 text-apven-gray hover:text-black'}">
                  ${v.badge || v.label}
                </button>
              `).join('')}
            </div>
          `;
        }

        return `
          <div class="bg-white rounded-3xl p-6 shadow-apple hover:shadow-apple-hover transition-all duration-200 flex flex-col justify-between">
            <div>
              <!-- Spec chips -->
              <div class="flex flex-wrap gap-1.5 mb-3">
                ${item.specs.map(s => `
                  <span class="text-[10px] font-bold uppercase tracking-wider text-apven-gray bg-neutral-100 px-2 py-0.5 rounded-full">${s}</span>
                `).join('')}
              </div>

              <!-- Product Graphic Visual -->
              <div class="bg-apven-canvas rounded-2xl flex items-center justify-center p-3 mb-4">
                ${renderVisual(item.graphicType, currentVar.color)}
              </div>

              <h3 class="text-lg font-bold tracking-tight text-apven-dark">${item.name}</h3>

              <!-- Compact Variants -->
              <div class="mt-3">
                ${variantSelector}
              </div>
            </div>

            <!-- Price and Buy Action -->
            <div class="mt-6 pt-4 border-t border-black/[0.06] flex items-center justify-between">
              <div>
                <span class="text-2xl font-extrabold text-apven-dark tracking-tight">$${currentVar.price}</span>
              </div>
              
              <div class="flex items-center space-x-2">
                <button onclick="quickAddBag('${item.id}')" title="Añadir a la bolsa" class="p-3 rounded-2xl bg-neutral-100 hover:bg-neutral-200 text-apven-dark transition-colors">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                </button>
                <button onclick="openInstantBuy('${item.id}')" class="px-5 py-3 rounded-2xl bg-black hover:bg-neutral-800 text-white text-xs font-semibold tracking-wide transition-transform active:scale-95">
                  Comprar
                </button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function setFilter(cat, btn) {
      currentFilter = cat;
      document.querySelectorAll('.filter-pill').forEach(b => {
        b.classList.remove('bg-white', 'text-black', 'shadow-sm');
        b.classList.add('text-apven-gray');
      });
      btn.classList.add('bg-white', 'text-black', 'shadow-sm');
      btn.classList.remove('text-apven-gray');
      renderGallery();
    }

    function pickVariant(id, idx) {
      selectedVariants[id] = idx;
      renderGallery();
    }

    function openInstantBuy(id) {
      const item = products.find(p => p.id === id);
      const v = item.variants[selectedVariants[id] || 0];
      currentPurchase = { name: item.name, variant: v.label, price: v.price };

      document.getElementById('checkoutItemDetails').innerHTML = `
        <div>
          <h4 class="text-sm font-bold text-apven-dark">${item.name}</h4>
          <span class="text-xs text-apven-gray">${v.label} &bull; Envío Gratis</span>
        </div>
        <span class="text-lg font-extrabold text-apven-dark">$${v.price}</span>
      `;
      document.getElementById('checkoutCardBtn').textContent = `Pagar $${v.price} con Tarjeta`;

      const modal = document.getElementById('checkoutModal');
      const card = document.getElementById('checkoutCard');
      modal.classList.remove('opacity-0', 'pointer-events-none');
      card.classList.remove('translate-y-8', 'sm:scale-95');
    }

    function closeCheckout() {
      const modal = document.getElementById('checkoutModal');
      const card = document.getElementById('checkoutCard');
      modal.classList.add('opacity-0', 'pointer-events-none');
      card.classList.add('translate-y-8', 'sm:scale-95');
    }

    function confirmOrder(method) {
      closeCheckout();
      showToast(`¡Orden confirmada con ${method}!`);
    }

    function quickAddBag(id) {
      const item = products.find(p => p.id === id);
      const v = item.variants[selectedVariants[id] || 0];
      const key = `${id}-${v.label}`;
      const found = cart.find(c => c.key === key);

      if (found) {
        found.qty += 1;
      } else {
        cart.push({ key, name: item.name, variant: v.label, price: v.price, qty: 1 });
      }
      updateCartDisplay();
      showToast('Añadido a tu bolsa');
    }

    function updateCartDisplay() {
      const count = cart.reduce((sum, i) => sum + i.qty, 0);
      const total = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
      document.getElementById('bagCounter').textContent = count;
      document.getElementById('cartDrawerTotal').textContent = `$${total}`;

      const list = document.getElementById('cartItemsList');
      if (cart.length === 0) {
        list.innerHTML = `
          <div class="h-44 flex flex-col items-center justify-center text-center text-apven-gray">
            <span class="text-xs font-medium">Bolsa vacía</span>
          </div>
        `;
      } else {
        list.innerHTML = cart.map(item => `
          <div class="flex items-center justify-between p-3.5 bg-apven-canvas rounded-2xl text-xs">
            <div>
              <p class="font-bold text-apven-dark">${item.name}</p>
              <p class="text-apven-gray">${item.variant} &times; ${item.qty}</p>
            </div>
            <div class="flex items-center space-x-2">
              <span class="font-bold text-apven-dark">$${item.price * item.qty}</span>
              <button onclick="removeBagItem('${item.key}')" class="text-apven-gray hover:text-black font-bold p-1">&times;</button>
            </div>
          </div>
        `).join('');
      }
    }

    function removeBagItem(key) {
      cart = cart.filter(c => c.key !== key);
      updateCartDisplay();
    }

    function toggleCartDrawer(open) {
      const drawer = document.getElementById('cartDrawer');
      const backdrop = document.getElementById('cartBackdrop');
      if (open) {
        backdrop.classList.remove('opacity-0', 'pointer-events-none');
        drawer.classList.remove('translate-x-full');
      } else {
        backdrop.classList.add('opacity-0', 'pointer-events-none');
        drawer.classList.add('translate-x-full');
      }
    }

    function openBagCheckout() {
      toggleCartDrawer(false);
      showToast('¡Procesando pedido de la bolsa!');
    }

    function showToast(text) {
      const t = document.getElementById('toast');
      document.getElementById('toastMsg').textContent = text;
      t.classList.remove('translate-y-24', 'opacity-0');
      setTimeout(() => {
        t.classList.add('translate-y-24', 'opacity-0');
      }, 2200);
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderGallery();
      updateCartDisplay();
    });
  </script>
</body>
</html>
